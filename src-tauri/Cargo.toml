[package]
name = "jd-kuaiche-assistant"
version = "0.1.0"
description = "京东快车推广计划自动轮换助手"
authors = ["SankaiAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jd_kuaiche_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"

[features]
default = []
