name: Desktop Builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
            rust_target: aarch64-apple-darwin
            artifact: jdka-macos-arm64
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
            rust_target: x86_64-pc-windows-msvc
            artifact: jdka-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 从标签同步版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/sync_version.py "${GITHUB_REF_NAME#v}"

      - name: 安装 Python 依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: 运行测试
        run: python -m pytest -q

      - name: 安装前端工具链
        run: npm ci

      - name: 构建桌面应用
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \))
          if [ ${#assets[@]} -eq 0 ]; then
            echo "没有找到任何安装包"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$REPO" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
