name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: 构建 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            artifact: jdka-macos-arm64
          - name: Windows x64
            os: windows-latest
            artifact: jdka-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从标签同步版本号
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          p = pathlib.Path("jdka/version.py")
          p.write_text(f'"""单一版本源。GitHub Actions 会在打 tag 时把版本同步到这里。"""\n\n__version__ = "{version}"\n', encoding="utf-8")
          t = pathlib.Path("pyproject.toml")
          s = t.read_text(encoding="utf-8")
          t.write_text(re.sub(r'^version = ".*"$', f'version = "{version}"', s, count=1, flags=re.M), encoding="utf-8")
          PY

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: 测试
        run: python -m pytest -q

      - name: 打包
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --name jdka --onedir \
            --add-data "jdka/ui:jdka/ui" \
            --collect-all playwright \
            jdka/cli.py

      - name: 压缩产物
        shell: bash
        run: |
          cd dist && tar -czf "../${{ matrix.artifact }}.tar.gz" jdka

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  publish:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            $(find artifacts -type f -name '*.tar.gz') \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
